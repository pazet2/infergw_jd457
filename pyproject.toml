[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pazet2-infergw_jd457"
version = "0.1.0"
description = "解析时间标记，排列推理网关架构师·工具调用的参数错配的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pazet2" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pazet2.github.io"
Repository = "https://github.com/pazet2/infergw_jd457"
Issues = "https://github.com/pazet2/infergw_jd457/issues"

[project.scripts]
infergw_jd457 = "infergw_jd457:main"

[tool.setuptools]
py-modules = ["infergw_jd457"]
